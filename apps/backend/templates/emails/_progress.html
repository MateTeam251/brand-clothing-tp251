<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;">
  <tr>
    <td width="25%" style="padding:0 4px;"><div style="height:4px;border-radius:2px;background-color:{% if step >= 1 %}#FFC2C2{% else %}#C9C9C9{% endif %};font-size:0;line-height:0;">&nbsp;</div></td>
    <td width="25%" style="padding:0 4px;"><div style="height:4px;border-radius:2px;background-color:{% if step >= 2 %}#FFC2C2{% else %}#C9C9C9{% endif %};font-size:0;line-height:0;">&nbsp;</div></td>
    <td width="25%" style="padding:0 4px;"><div style="height:4px;border-radius:2px;background-color:{% if step >= 3 %}#FFC2C2{% else %}#C9C9C9{% endif %};font-size:0;line-height:0;">&nbsp;</div></td>
    <td width="25%" style="padding:0 4px;"><div style="height:4px;border-radius:2px;background-color:{% if step >= 4 %}#FFC2C2{% else %}#C9C9C9{% endif %};font-size:0;line-height:0;">&nbsp;</div></td>
  </tr>
  <tr>
    <td align="center" valign="top" style="padding:8px 4px 0;font-family:Cambria,Georgia,'Times New Roman',serif;font-size:12px;line-height:16px;color:{% if step == 1 %}#000000{% else %}#6B6B6B{% endif %};">Виготовлення</td>
    <td align="center" valign="top" style="padding:8px 4px 0;font-family:Cambria,Georgia,'Times New Roman',serif;font-size:12px;line-height:16px;color:{% if step == 2 %}#000000{% else %}#6B6B6B{% endif %};">Очікує відправки</td>
    <td align="center" valign="top" style="padding:8px 4px 0;font-family:Cambria,Georgia,'Times New Roman',serif;font-size:12px;line-height:16px;color:{% if step == 3 %}#000000{% else %}#6B6B6B{% endif %};">Відправлено</td>
    <td align="center" valign="top" style="padding:8px 4px 0;font-family:Cambria,Georgia,'Times New Roman',serif;font-size:12px;line-height:16px;color:{% if step == 4 %}#000000{% else %}#6B6B6B{% endif %};">Доставлено</td>
  </tr>
</table>
