x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Own tag (git tree hash of db/), changes only when db/ changes, so a normal
    # release doesn't restart Postgres. Set by the release pipeline.
    image: ${ECR_REGISTRY}/brand-clothing-db:${DB_IMAGE_TAG}
    container_name: brand_clothing_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WALG_S3_PREFIX: ${WALG_S3_PREFIX}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      PGHOST: /var/run/postgresql
      PGDATABASE: ${POSTGRES_DB}
      # The image creates only POSTGRES_USER as a role, no "postgres" role.
      # Without this, the nightly WAL-G backup (cron, OS user postgres)
      # connected as role "postgres" and failed, so no base backup existed.
      PGUSER: ${POSTGRES_USER}
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${DB_MEM_LIMIT:-768m}
    logging: *logging

  web:
    image: ${ECR_REGISTRY}/brand-clothing-backend:${IMAGE_TAG}
    container_name: brand_clothing_web
    restart: always
    # One line on purpose: a folded multi-line command keeps line breaks and
    # turns a failed migrate into a misleading "command not found" (exit 127).
    # No gunicorn access log: nginx already logs every request (as JSON).
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"]
    env_file:
      - .env
    environment:
      # .env holds every SSM parameter, incl. the Grafana agent token. The app
      # doesn't need it; "environment" overrides env_file, so blank it here.
      GRAFANA_CLOUD_TOKEN: ""
    volumes:
      # error.log / payments.log survive container recreation (every deploy).
      - /data/app-logs:/app/logs
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: ${WEB_MEM_LIMIT:-768m}
    logging: *logging

  nginx:
    image: public.ecr.aws/nginx/nginx:1.28-alpine
    container_name: brand_clothing_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    mem_limit: 64m
    logging: *logging

  # Background jobs (carts.tasks: hourly abandoned-cart marking, weekly
  # report to the reports bucket). Only started where COMPOSE_PROFILES
  # contains "celery" (SSM app-config): prod yes, staging no (1 GB RAM).
  # Run the same jobs by hand on staging:
  #   docker compose run --rm web python manage.py cart_report --mark-abandoned
  redis:
    image: public.ecr.aws/docker/library/redis:7.4-alpine
    container_name: brand_clothing_redis
    restart: always
    profiles: ["celery"]
    # Broker only: no persistence (a lost queued task is re-sent by beat on
    # its next run), fixed memory cap, refuse writes instead of evicting tasks.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 64m
    logging: *logging

  # One worker with beat embedded (-B): safe because there is always exactly
  # one instance. Same image as web. Schedule file in /tmp (/app is read-only
  # for the app user).
  celery:
    image: ${ECR_REGISTRY}/brand-clothing-backend:${IMAGE_TAG}
    container_name: brand_clothing_celery
    restart: always
    profiles: ["celery"]
    command: ["celery", "-A", "config", "worker", "-B", "--concurrency=1", "--loglevel=INFO", "-s", "/tmp/celerybeat-schedule"]
    env_file:
      - .env
    environment:
      GRAFANA_CLOUD_TOKEN: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: ${CELERY_MEM_LIMIT:-256m}
    logging: *logging

  # Grafana Alloy: pushes host metrics and container logs to Grafana Cloud.
  # Outbound HTTPS only, no ports. Values come from SSM via .env
  # (app-config.tf; the token from secrets/GRAFANA_CLOUD_TOKEN).
  alloy:
    image: grafana/alloy:v1.11.0
    container_name: brand_clothing_alloy
    restart: always
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    configs:
      - source: alloy
        target: /etc/alloy/config.alloy
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-unknown}
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL:-}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER:-}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
    volumes:
      # Host metrics (read-only views of the host).
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      # Container discovery + logs. Note: Docker socket access is root-equivalent.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: ${ALLOY_MEM_LIMIT:-160m}
    logging: *logging

configs:
  alloy:
    # Alloy config, inline so it ships with this file (embedded in user-data).
    # No "$" in here: compose would interpolate it (write "$$" if ever needed).
    content: |
      logging {
        level = "warn"
      }

      // ---- Metrics: CPU, memory, disk (/ and /data), network ----
      prometheus.exporter.unix "host" {
        procfs_path    = "/host/proc"
        sysfs_path     = "/host/sys"
        rootfs_path    = "/host/root"
        set_collectors = ["cpu", "meminfo", "filesystem", "loadavg", "netdev", "diskstats", "pressure", "time", "uname"]
      }

      prometheus.scrape "host" {
        targets         = prometheus.exporter.unix.host.targets
        forward_to      = [prometheus.relabel.instance.receiver]
        scrape_interval = "60s"
      }

      prometheus.relabel "instance" {
        forward_to = [prometheus.remote_write.cloud.receiver]

        rule {
          target_label = "instance"
          replacement  = sys.env("DEPLOY_ENV")
        }
      }

      prometheus.remote_write "cloud" {
        external_labels = { env = sys.env("DEPLOY_ENV") }

        endpoint {
          url = sys.env("GRAFANA_PROM_URL")

          basic_auth {
            username = sys.env("GRAFANA_PROM_USER")
            password = sys.env("GRAFANA_CLOUD_TOKEN")
          }
        }
      }

      // ---- Logs: stdout/stderr of web, nginx, db, celery, redis ----
      discovery.docker "containers" {
        host = "unix:///var/run/docker.sock"
      }

      discovery.relabel "containers" {
        targets = discovery.docker.containers.targets

        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/brand_clothing_(web|nginx|db|celery|redis)"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/brand_clothing_(.+)"
          target_label  = "container"
        }
      }

      loki.source.docker "containers" {
        host       = "unix:///var/run/docker.sock"
        targets    = discovery.relabel.containers.output
        forward_to = [loki.process.scrub.receiver]
      }

      loki.process "scrub" {
        forward_to = [loki.write.cloud.receiver]

        // The "payments" logger prints WayForPay callback data (names, emails,
        // phones). It stays on the instance (/data/app-logs/payments.log) only.
        stage.drop {
          expression = "^\\[payments"
        }
      }

      loki.write "cloud" {
        external_labels = { env = sys.env("DEPLOY_ENV") }

        endpoint {
          url = sys.env("GRAFANA_LOKI_URL")

          basic_auth {
            username = sys.env("GRAFANA_LOKI_USER")
            password = sys.env("GRAFANA_CLOUD_TOKEN")
          }
        }
      }
