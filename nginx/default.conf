# Access log as one JSON object per request, so Grafana (Loki) can filter and
# chart by field: {container="nginx"} | json | status >= 500
# Deliberately left out: client IP (personal data under GDPR), query string
# ($uri, not $request_uri: reset/activation tokens live there) and referer.
log_format json_access escape=json '{'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"'
'}';

# Origin certificate from the certbot container. A variable path makes nginx
# load it per handshake: it starts before the first certificate exists and
# picks up renewals without a reload. ${ORIGIN_HOST} is filled in at container
# start (nginx image template).
map $host $origin_cert_dir {
    default /etc/letsencrypt/live/${ORIGIN_HOST};
}

upstream django {
    server web:8000;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     $origin_cert_dir/fullchain.pem;
    ssl_certificate_key $origin_cert_dir/privkey.pem;
    server_name _;

    client_max_body_size 20m;   # product image uploads through the admin

    access_log /dev/stdout json_access;

    # Bots and scanners often send no Host header; nginx then uses the
    # server_name "_" as $host and Django logs a DisallowedHost traceback for
    # each one. Close those connections here (444 = no response at all).
    # Real browsers, curl and the uptime check always send a Host header.
    if ($http_host = "") {
        return 444;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
