# Access log as one JSON object per request, so Grafana (Loki) can filter and
# chart by field: {container="nginx"} | json | status >= 500
# Deliberately left out: client IP (personal data under GDPR), query string
# ($uri, not $request_uri: reset/activation tokens live there) and referer.
log_format json_access escape=json '{'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"'
'}';

upstream django {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;   # product image uploads through the admin

    access_log /dev/stdout json_access;

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
