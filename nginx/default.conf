# JSON access log for Loki. No client IP, query string (tokens) or referer.
log_format json_access escape=json '{'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"'
'}';

# Real viewer IP = last X-Forwarded-For entry (added by CloudFront).
map $http_x_forwarded_for $viewer_ip {
    "~(?<last>[^,\s]+)\s*$" $last;
    default                  $remote_addr;
}

limit_req_zone $viewer_ip zone=login:10m rate=10r/m;
limit_req_zone $viewer_ip zone=email:10m rate=3r/m;
limit_req_zone $viewer_ip zone=checkout:10m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;

# Variable path: starts without a cert, picks up renewals without a reload.
map $host $origin_cert_dir {
    default /etc/letsencrypt/live/${ORIGIN_HOST};
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     $origin_cert_dir/fullchain.pem;
    ssl_certificate_key $origin_cert_dir/privkey.pem;
    server_name _;

    client_max_body_size 20m;

    access_log /dev/stdout json_access;

    # Bots without a Host header.
    if ($http_host = "") {
        return 444;
    }

    # Resolve "web" per request: a recreated container gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://web:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Public site name (CloudFront sends Host = origin name), so Django builds
    # links (activation emails, pagination) with it. Empty SITE_HOST = not sent.
    proxy_set_header X-Forwarded-Host "${SITE_HOST}";
    proxy_read_timeout 60s;

    # 429 in DRF's format, so the frontend can show "detail".
    error_page 429 @too_many_json;
    location @too_many_json {
        default_type application/json;
        return 429 '{"detail":"Too many attempts. Wait a minute and try again."}';
    }
    location @too_many_html {
        default_type text/html;
        return 429 '<!doctype html><title>Too many attempts</title><p>Too many login attempts. Wait a minute and try again.</p>';
    }

    location / {
        proxy_pass $django;
    }

    # Product form uploads all photos in one request.
    location /api/admin/ {
        client_max_body_size 150m;
        proxy_pass $django;
    }

    location = /api/admin/login/ {
        limit_req zone=login burst=5 nodelay;
        error_page 429 @too_many_html;
        proxy_pass $django;
    }

    location = /api/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass $django;
    }

    location ~ ^/api/auth/(register|password-reset)/$ {
        limit_req zone=email burst=3 nodelay;
        proxy_pass $django;
    }

    location = /api/orders/checkout/ {
        limit_req zone=checkout burst=5 nodelay;
        proxy_pass $django;
    }
}
