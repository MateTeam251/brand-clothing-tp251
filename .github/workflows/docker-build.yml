name: Docker Build
run-name: ${{ github.actor }} - ${{ github.head_ref || github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/backend/**"
      - "db/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/backend/**"
      - "db/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for AWS

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: apps/backend
          - image: db
            context: db

    env:
      # Push only from develop/main, never from PRs. This matches the ECR push role's trust policy.
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' && (github.ref_name == 'develop' || github.ref_name == 'main') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The t4g instances are ARM (Graviton). QEMU lets the x86 runner build arm64 images.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        if: env.SHOULD_PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: env.SHOULD_PUSH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build (and push on develop/main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: ${{ env.SHOULD_PUSH == 'true' }}
          tags: ${{ env.SHOULD_PUSH == 'true' && format('{0}/brand-clothing-{1}:{2}', steps.ecr.outputs.registry, matrix.image, github.sha) || format('brand-clothing-{0}:ci', matrix.image) }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
