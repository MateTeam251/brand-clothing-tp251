name: Backend CI
run-name: ${{ github.actor }} - ${{ github.head_ref || github.ref_name }} - ${{ github.sha }}

on:
  # Pushes to develop/main run these tests through release.yml (workflow_call),
  # right before building and deploying.
  workflow_call:
  # No path filter on PRs: this is a required check, and a required check
  # that never runs would block the PR forever.
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/backend

env:
  SECRET_KEY: ci-dummy-secret-key
  DEBUG: "False"
  POSTGRES_DB: brand_clothing_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  # Redis like on the servers: Celery broker + Django cache (DRF throttling).
  REDIS_HOST: localhost
  REDIS_PORT: "6379"

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brand_clothing_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same Python as the image: the version comes from Dockerfile.prod, so a
      # Dependabot bump of the base image tests on the new Python automatically.
      - name: Python version from Dockerfile
        id: python
        run: echo "version=$(grep -m1 -oP '^FROM python:\K[0-9]+\.[0-9]+' Dockerfile.prod)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      # pytest-cov is CI-only, so it stays out of the production requirements.txt.
      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: pytest -v --cov --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          echo "## Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          if-no-files-found: ignore
