apiVersion: 1
groups:
    - orgId: 1
      name: prod-backups
      folder: brand-clothing
      interval: 10m
      rules:
        - uid: bfzzeuyy4ipz4d
          title: prod backup failed
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                datasource:
                    type: loki
                    uid: grafanacloud-logs
                editorMode: code
                expr: count_over_time({env="prod", container="db"} |= "WAL-G backup FAILED" [1h])
                hide: false
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          isPaused: false
          notification_settings:
            receiver: grafana-maxmlv-email
        - uid: bfzzf098sjlkwc
          title: prod WAL archiving failing
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                datasource:
                    type: loki
                    uid: grafanacloud-logs
                editorMode: code
                expr: count_over_time({env="prod", container="db"} |= "archive command failed" [15m])
                hide: false
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          isPaused: false
          notification_settings:
            receiver: grafana-maxmlv-email
        - uid: afzzf81vtv11ce
          title: prod backup missing (26h)
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                datasource:
                    type: loki
                    uid: grafanacloud-logs
                editorMode: code
                expr: count_over_time({env="prod", container="db"} |= "WAL-G backup completed" [26h])
                hide: false
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 10m
          isPaused: true
          notification_settings:
            receiver: grafana-maxmlv-email
    - orgId: 1
      name: prod-infra
      folder: brand-clothing
      interval: 1m
      rules:
        - uid: cfzx8315d7w8we
          title: prod disk above 85%
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: 100 * (1 - node_filesystem_avail_bytes{env="prod", mountpoint=~"/|/data"} / node_filesystem_size_bytes{env="prod", mountpoint=~"/|/data"})
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          isPaused: false
          notification_settings:
            receiver: grafana-maxmlv-email
        - uid: ffzx88245wa2oe
          title: prod memory available below 10%
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: 100 * node_memory_MemAvailable_bytes{env="prod"} / node_memory_MemTotal_bytes{env="prod"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 10
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          isPaused: false
          notification_settings:
            receiver: grafana-maxmlv-email
        - uid: afzx8c40udm9sc
          title: prod not sending metrics
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: absent_over_time(up{env="prod"}[10m])
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          isPaused: false
          notification_settings:
            receiver: grafana-maxmlv-email
        - uid: ffzzlfs59faioa
          title: prod 5xx errors
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                datasource:
                    type: loki
                    uid: grafanacloud-logs
                editorMode: code
                expr: sum(count_over_time({env="prod", container="nginx"} | json | __error__="" | status >= 500 [5m]))
                hide: false
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          isPaused: false
          notification_settings:
            receiver: grafana-maxmlv-email
    - orgId: 1
      name: Failed Checks [5m]
      folder: Grafana Synthetic Monitoring
      interval: 1m
      rules:
        - uid: sm-failed-executions-5m-2cd6b47b
          title: ProbeFailedExecutionsTooHigh [5m]
          condition: condition
          data:
            - refId: executions
              queryType: instant
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                datasource:
                    type: loki
                    uid: grafanacloud-logs
                expr: sum  by(instance, job) (count_over_time({source="synthetic-monitoring-agent", probe_success="0"} | logfmt | __error__ = "" | msg="Check failed" [5m]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: executions
            - refId: threshold
              relativeTimeRange:
                from: 60
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: (sum by (instance, job) (sm_alerts_threshold_probe_failed_executions_too_high{period="5m"}) * on (instance, job) group_right() (max without(probe, region, geohash, config_version) (sm_check_info{sm_region=""}) or max without(probe, sm_region, geohash, config_version) (sm_check_info{sm_region!=""}))) or sum by (instance, job) (sm_alerts_threshold_probe_failed_executions_too_high{job="__internal__", instance="__internal__", period="5m"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: threshold
            - refId: condition
              datasourceUid: __expr__
              model:
                datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                expression: ${executions} >= ${threshold}
                intervalMs: 1000
                maxDataPoints: 43200
                refId: condition
                type: math
          noDataState: OK
          execErrState: KeepLast
          annotations:
            dashboard_url: https://sturdyscone1696.grafana.net/a/grafana-synthetic-monitoring-app/scene?var-instance={{ urlquery $labels.instance }}&var-job={{ urlquery $labels.job }}&var-probe=$__all
            runbook_url: https://sturdyscone1696.grafana.net/a/grafana-synthetic-monitoring-app/scene?var-instance={{ urlquery $labels.instance }}&var-job={{ urlquery $labels.job }}&var-probe=$__all&var-alert={{ urlquery $labels.alertname }}&var-runbook=true
            summary: Check job:{{ $labels.job }} instance:{{ $labels.instance }} has failed {{ $values.executions.Value }} times in the last 5m.
          labels:
            __grafana_origin: plugin/grafana-synthetic-monitoring-app
            namespace: synthetic_monitoring
          isPaused: false
